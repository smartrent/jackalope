name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  COVERAGE_TARGET: "80"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.tag }}
    runs-on: ubuntu-latest
    container:
      image: hexpm/elixir:${{ matrix.tag }}
    env:
      LC_ALL: C.UTF-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: 1.19.0-erlang-28.1-alpine-3.22.2
            latest: true
          - tag: 1.18.2-erlang-27.3.4-alpine-3.22.2
            latest: false
          - tag: 1.17.3-erlang-27.1-alpine-3.20.3
            latest: false
          - tag: 1.16.3-erlang-26.2.5-alpine-3.19.1
            latest: false
          - tag: 1.15.7-erlang-26.2.4-alpine-3.18.6
            latest: false
          - tag: 1.14.5-erlang-25.3.2.11-alpine-3.17.7
            latest: false
          - tag: 1.13.4-erlang-24.3.4.17-alpine-3.16.9
            latest: false
    steps:
      - name: Install git and build tools
        run: apk add --no-cache git build-base

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install hex and rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _build
            deps
          key: v1-mix-cache-${{ matrix.tag }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: |
          # shellcheck disable=SC2209
          MIX_ENV=test mix compile --warnings-as-errors
      - run: mix test || mix test
        if: ${{ !matrix.latest }}

      - name: Run tests with coverage (latest only)
        if: matrix.latest
        run: |
          set -o pipefail
          mix test --cover | tee coverage_output.txt || mix test --cover | tee coverage_output.txt

      # Parses the `xx.xx% | Total` line for the coverage_report job.
      # Not enforced -- mix.exs sets threshold: 0, so only a test failure fails this job.
      - name: Summarize coverage (latest only)
        if: always() && matrix.latest
        run: |
          pct=$(grep -E '[0-9]+(\.[0-9]+)?% \| Total\b' coverage_output.txt 2>/dev/null | tail -1 \
                | grep -oE '[0-9]+(\.[0-9]+)?' | head -1 || true)
          pct=${pct:-0}
          echo "${pct} ${COVERAGE_TARGET}" > coverage_summary.txt
          {
            echo "### Coverage"
            echo ""
            echo "Line coverage is **${pct}%** (target ${COVERAGE_TARGET}%)."
            awk -v p="$pct" -v t="$COVERAGE_TARGET" 'BEGIN {
              if (p + 0 < t + 0)
                print "\n:warning: Below target — consider adding tests to help meet the goal."
              else
                print "\n:white_check_mark: Meets target."
            }'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage summary (latest only)
        if: always() && matrix.latest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-summary
          path: coverage_summary.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Format check
        if: matrix.latest
        run: mix format --check-formatted

      - name: Unused deps check
        if: matrix.latest
        run: mix deps.unlock --check-unused

      - name: Build docs
        if: matrix.latest
        run: mix docs

      - name: Hex build
        if: matrix.latest
        run: mix hex.build

      - name: Credo
        if: matrix.latest
        run: mix credo -a --strict --ignore-checks "refactor"

      - name: Dialyzer
        if: matrix.latest
        run: mix dialyzer

  # Posts a sticky, non-blocking PR comment with the coverage % from the build-test job.
  coverage_report:
    needs: build-test
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download coverage summary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-summary

      - name: Post coverage comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- jackalope-coverage-report -->'

          if [ ! -f coverage_summary.txt ]; then
            echo "No coverage data found; skipping comment."
            exit 0
          fi
          read -r pct tgt < coverage_summary.txt

          status='✅'
          note="> ✅ Coverage meets the **${tgt}%** target. Nice work!"
          if awk -v p="$pct" -v t="$tgt" 'BEGIN { exit !(p + 0 < t + 0) }'; then
            status='⚠️ consider adding tests'
            note="> ⚠️ Coverage is below the **${tgt}%** target. Coverage is **not enforced** — this won't block the PR. Please consider adding tests to help meet the goal. 💚"
          fi

          {
            echo "## 🧪 Test coverage report"
            echo ""
            echo "| Coverage | Target | Status |"
            echo "|---:|---:|---|"
            echo "| ${pct}% | ${tgt}% | ${status} |"
            echo ""
            echo "$note"
            echo ""
            echo "<sub>Measured with \`mix test --cover\`. ${marker}</sub>"
          } > comment.md

          existing=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
                     --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -1 || true)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${existing}" \
              -f body="$(cat comment.md)" >/dev/null
            echo "Updated existing coverage comment (${existing})."
          else
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -f body="$(cat comment.md)" >/dev/null
            echo "Created coverage comment."
          fi
